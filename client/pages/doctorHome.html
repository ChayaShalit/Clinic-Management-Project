<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אזור הרופא</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script type="module" src="../js/doctorHome.js" defer></script>
</head>

<body>
    <header class="site-header no-print">
        <div class="container d-flex align-items-center justify-content-between">
            <h2 class="brand">מרפאה דיגיטלית</h2>
            <nav class="d-none d-md-flex gap-4">
                <a href="doctorHome.html" class="nav-link-clinic active">התורים של היום</a>
                <a href="createReferal.html" class="nav-link-clinic">יצירת הפניה</a>
            </nav>
            <span class="user-chip" id="user-chip">שלום, ד״ר</span>
        </div>
    </header>

    <section class="hero no-print">
        <div class="container">
            <h1>אזור הרופא</h1>
            <p>כאן תמצא/י את התורים של היום ותוכל/י לשלוח הפניות למטופלים</p>

        </div>
    </section>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">התורים של היום</h2>
            <button id="print-btn" type="button" class="btn btn-outline-primary no-print">
                <i class="bi bi-printer" aria-hidden="true"></i> הדפסה
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover bg-white align-middle">
                <thead>
                    <tr>
                        <th scope="col">שעה</th>
                        <th scope="col">מטופל</th>
                        <th scope="col">סוג טיפול</th>
                    </tr>
                </thead>
                <tbody id="appointments-body">
                    <tr>
                        <td colspan="3" class="text-center text-muted">התורים של היום יוצגו כאן</td>
                    </tr>
                </tbody>
            </table>
        </div>

    <footer class="site-footer no-print">
        <div class="container text-center">
            מרפאה דיגיטלית · טלפון: 03-1234567 · א׳–ה׳ 8:00–18:00

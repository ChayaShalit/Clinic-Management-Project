<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הפרופיל שלי · מרפאה דיגיטלית</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/profile.css" rel="stylesheet">
  <script type="module" src="../js/profile.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container d-flex align-items-center justify-content-between">
      <h2 class="brand">מרפאה דיגיטלית</h2>
      <div class="d-flex align-items-center gap-3">
        <a id="homeLink" href="login.html" class="nav-link-clinic">חזרה לדף הבית</a>
        <button type="button" id="logout" class="btn btn-sm btn-outline-secondary">התנתקות</button>
      </div>
    </div>
  </header>

  <main class="container profile-page">
    <h1 class="profile-title">הפרופיל שלי</h1>

    <!-- תמונת פרופיל -->
    <section class="profile-card avatar-card" aria-labelledby="displayName">
      <div class="avatar-wrap">
        <img id="profileImg" class="avatar" alt="תמונת הפרופיל שלי" width="120" height="120">
        <button type="button" id="changeImageBtn" class="avatar-btn" aria-label="החלפת תמונת פרופיל">
          <span aria-hidden="true">📷</span>
        </button>
        <input type="file" id="imageInput" accept="image/*" hidden>
      </div>
      <div>
        <h2 id="displayName" class="h5 mb-1"></h2>
        <span id="roleBadge" class="role-badge"></span>
        <p class="avatar-hint">קובץ תמונה, עד 5MB</p>
      </div>
    </section>

    <form id="profileForm" novalidate>

      <!-- פרטים משותפים לשני התפקידים -->
      <fieldset class="profile-card">
        <legend class="profile-legend">פרטים אישיים</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">שם מלא</label>
            <input type="text" id="name" name="name" class="form-control"
                   required minlength="2" autocomplete="name">
            <div class="invalid-feedback">נא להזין שם (לפחות 2 תווים).</div>
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label">טלפון</label>
            <input type="tel" id="phone" name="phone" class="form-control" dir="ltr"
                   pattern="0\d{1,2}-?\d{7}" placeholder="050-1234567" autocomplete="tel">
            <div class="invalid-feedback">מספר טלפון לא תקין. לדוגמה: 050-1234567.</div>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">אימייל</label>
            <input type="email" id="email" name="email" class="form-control" dir="ltr" required autocomplete="email">
          </div>
          <div class="col-md-6">
            <label for="tz" class="form-label">תעודת זהות</label>
            <input type="text" id="tz" name="tz" class="form-control" dir="ltr" disabled>
          </div>
        </div>
        <p class="field-note"> ת.ז אינה ניתנת לשינוי.</p>
      </fieldset>

      <!-- שדות מטופל בלבד -->
      <fieldset class="profile-card" data-role="patient">
        <legend class="profile-legend">פרטים רפואיים</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="dateBirth" class="form-label">תאריך לידה</label>
            <input type="date" id="dateBirth" name="dateBirth" class="form-control">
            <div class="invalid-feedback">תאריך הלידה לא יכול להיות בעתיד.</div>
          </div>
          <div class="col-12">
            <label for="medicalNotes" class="form-label">הערות רפואיות</label>
            <textarea id="medicalNotes" name="medicalNotes" class="form-control"
                      rows="4" maxlength="1000"
                      placeholder="אלרגיות, תרופות קבועות, מידע שחשוב שהרופא ידע..."></textarea>
            <div class="field-note"><span id="notesCount">0</span> / 1000</div>
          </div>
        </div>
      </fieldset>

      <!-- שדות רופא בלבד -->
      <fieldset class="profile-card" data-role="doctor">
        <legend class="profile-legend">פרטים מקצועיים</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="specialty" class="form-label">התמחות</label>
            <input type="text" id="specialty" name="specialty" class="form-control" maxlength="100"
                   placeholder="לדוגמה: רפואת משפחה">
          </div>
      </fieldset>

      <div id="apiMessage" role="status" aria-live="polite" style="display: none;"></div>
      <button type="submit" id="saveBtn" class="btn btn-primary btn-lg w-100">שמירת שינויים</button>
    </form>
  </main>
</body>
</html>

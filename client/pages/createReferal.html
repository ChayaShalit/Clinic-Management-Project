<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפניה חדשה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script type="module" src="../js/createReferal.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container d-flex align-items-center justify-content-between">
            <h2 class="brand">מרפאה דיגיטלית</h2>
            <nav class="d-none d-md-flex gap-4">
                <a href="doctorHome.html" class="nav-link-clinic">התורים של היום</a>
                <a href="createReferal.html" class="nav-link-clinic active">יצירת הפניה</a>
            </nav>
            <span class="user-chip">שלום, ד״ר</span>
        </div>
    </header>
    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h1 class="h3 mb-4">הפניה חדשה</h1>
                <a href="doctorHome.html" class="d-inline-block mb-3">← חזרה לאזור הרופא</a>
                <form id="referal-form" class="card card-body shadow-sm">
              

                <div class="mb-3">
                    <label for="patientTz" class="form-label">תעודת זהות של המטופל</label>
                    <input type="text" id="patientTz" name="patientTz" class="form-control" required pattern="[0-9]{9}" minlength="9"
                        maxlength="9" inputmode="numeric">
                </div>

                    <div class="mb-3">
                        <label for="kindReferal" class="form-label">סוג ההפניה</label>
                        <select id="kindReferal" name="kindReferal" class="form-select" required>
                            <option value="">בחירה...</option>
                            <option value="בדיקת דם">בדיקת דם</option>
                            <option value="הפניה לרופא מומחה">הפניה לרופא מומחה</option>
                            <option value="מרשם">מרשם</option>
                            <option value="אחר">אחר</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">תיאור</label>
                        <textarea id="description" name="description" class="form-control" rows="4" required
                            minlength="5"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="attachedFile" class="form-label">קובץ מצורף (לא חובה)</label>
                        <input type="file" id="attachedFile" name="attachedFile" class="form-control"
                            accept=".pdf,image/*">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">שליחה</button>
                </form>

                <p id="message" class="mt-3" role="status"></p>
            </div>
        </div>
    </main>
</body>

</html>

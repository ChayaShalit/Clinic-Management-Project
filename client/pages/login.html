<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התחברות - מערכת ניהול תורים</title>
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module"  src="../js/login.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <h2>התחברות למערכת</h2>
    <div class="auth-sub">הזינו את פרטי החשבון שלכם</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">כתובת אימייל</label>
        <input type="email" id="email" name="email" placeholder="האימייל שבו נרשמתם" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">סיסמה</label>
      <input type="password" id="password" name="password" placeholder="הסיסמה שבחרתם בהרשמה" autocomplete="current-password"
        required>
      </div>

      <div id="apiMessage"></div>

      <button type="submit" class="btn-submit" id="submitBtn">התחבר</button>
    </form>

    <div class="auth-footer">
      עדיין אין לכם חשבון? <a href="register.html">הירשמו כאן</a>
    </div>
  </div>
</div>

<script>
 
</script>

</body>
</html>
